<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J3anClaud3</title>
<meta name="description" content="J3anClaud3, assistant IA francophone et chef d'orchestre d'agents">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<style>
:root {
  --bg: #f4f5f7; --surface: #ffffff; --surface-2: #eef0f3; --text: #16181d; --muted: #646b78;
  --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #d7f0ec; --me: #0f766e; --me-ink: #ffffff;
  --border: #dde1e7; --danger: #b42318; --ok: #15803d; --shadow: 0 1px 2px rgba(16,24,40,.06);
  --radius: 16px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1013; --surface: #171a1f; --surface-2: #20242b; --text: #e8eaee; --muted: #9aa1ad;
    --accent: #2dd4bf; --accent-ink: #062723; --accent-soft: #123b37; --me: #134e48; --me-ink: #e8fffb;
    --border: #2a2f37; --danger: #f97066; --ok: #4ade80; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1013; --surface: #171a1f; --surface-2: #20242b; --text: #e8eaee; --muted: #9aa1ad;
  --accent: #2dd4bf; --accent-ink: #062723; --accent-soft: #123b37; --me: #134e48; --me-ink: #e8fffb;
  --border: #2a2f37; --danger: #f97066; --ok: #4ade80; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
.hidden { display: none !important; }

/* login */
#login { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
.card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 28px 24px; box-shadow: var(--shadow); }
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.brand img { width: 44px; height: 44px; }
.brand h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
.field { width: 100%; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface-2); outline: none; }
.field:focus { border-color: var(--accent); }
.primary { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 12px;
  background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
.primary:disabled { opacity: .6; cursor: default; }
.error { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 10px; }
.note { color: var(--muted); font-size: 12px; margin-top: 14px; }

/* chat layout */
#chat { height: 100%; display: flex; flex-direction: column; max-width: 860px; margin: 0 auto;
  background: var(--surface); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  padding-top: max(10px, env(safe-area-inset-top)); border-bottom: 1px solid var(--border); background: var(--surface); }
header img { width: 36px; height: 36px; }
header .who { flex: 1; min-width: 0; }
header .who b { display: block; font-size: 15px; }
header .who span { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.on { background: var(--ok); }
.icon-btn { border: 1px solid var(--border); background: var(--surface-2); border-radius: 10px;
  padding: 6px 10px; font-size: 13px; cursor: pointer; white-space: nowrap; color: var(--text);
  text-decoration: none; display: inline-flex; align-items: center; gap: 6px; line-height: 1.3; }
#feed { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
  overscroll-behavior: contain; }
.row { display: flex; }
.row.u { justify-content: flex-end; }
.bubble { max-width: min(82%, 620px); padding: 10px 13px; border-radius: var(--radius);
  background: var(--surface-2); overflow-wrap: anywhere; box-shadow: var(--shadow); }
.row.u .bubble { background: var(--me); color: var(--me-ink); border-bottom-right-radius: 6px; }
.row.m .bubble { border-bottom-left-radius: 6px; }
.bubble p { margin: 0; }
.bubble p + p { margin-top: 6px; }
.bubble ul { margin: 4px 0; padding-left: 20px; }
.bubble code { background: rgba(127,127,127,.18); padding: 1px 5px; border-radius: 6px; font-size: 13px; }
.time { font-size: 11px; color: var(--muted); margin-top: 4px; text-align: right; }
.row.u .time { color: inherit; opacity: .7; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.choice { border: 1px solid var(--accent); color: var(--accent); background: transparent;
  border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.choice:first-child { background: var(--accent); color: var(--accent-ink); }
.choice:disabled { opacity: .45; cursor: default; }
.doc { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.doc .ico { width: 38px; height: 44px; border-radius: 8px; background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
.doc .meta { flex: 1 1 140px; min-width: 0; }
.doc .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc .meta span { font-size: 12px; color: var(--muted); }
.doc .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.typing { color: var(--muted); font-size: 13px; padding: 0 16px 6px; }
.typing i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
  margin-right: 3px; animation: blink 1.2s infinite both; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .2 } 40% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .typing i { animation: none; } }
.quick { display: flex; gap: 8px; padding: 8px 16px 0; overflow-x: auto; scrollbar-width: none; }
.quick button { border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px;
  padding: 5px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
form#composer { display: flex; gap: 8px; align-items: flex-end; padding: 10px 16px;
  padding-bottom: max(10px, env(safe-area-inset-bottom)); }
#input { flex: 1; resize: none; max-height: 180px; min-height: 44px; padding: 11px 14px; border-radius: 22px;
  border: 1px solid var(--border); background: var(--surface-2); outline: none; }
#input:focus { border-color: var(--accent); }
#sendBtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent);
  color: var(--accent-ink); cursor: pointer; display: grid; place-items: center; flex: none; }
#sendBtn:disabled { opacity: .5; }
.empty { margin: auto; text-align: center; color: var(--muted); max-width: 420px; padding: 20px; }
.empty b { color: var(--text); }

/* preview modal */
dialog { width: min(820px, calc(100% - 32px)); max-height: calc(100% - 48px); border: 1px solid var(--border);
  border-radius: 16px; padding: 0; background: var(--surface); color: var(--text); }
dialog::backdrop { background: rgba(0,0,0,.45); }
dialog header { position: sticky; top: 0; padding-top: 10px; }
#previewBody { padding: 16px 20px 24px; overflow-wrap: anywhere; }
#previewBody h1, #previewBody h2, #previewBody h3 { line-height: 1.25; margin: 18px 0 8px; }
#previewBody pre { background: var(--surface-2); padding: 12px; border-radius: 10px; overflow-x: auto; }
#previewBody table { border-collapse: collapse; display: block; overflow-x: auto; }
#previewBody td, #previewBody th { border: 1px solid var(--border); padding: 4px 8px; }
@media (max-width: 600px) {
  #chat { border: 0; }
  .bubble { max-width: 90%; }
}
</style>
</head>
<body>
<main id="login" class="hidden">
  <form class="card" id="loginForm" autocomplete="on">
    <div class="brand">
      <img src="/icon.svg" alt="">
      <div><h1>J3anClaud3</h1><p id="tagline">Votre assistant IA francophone</p></div>
    </div>
    <label for="name">Votre prénom</label>
    <input class="field" id="name" name="username" autocomplete="given-name" required maxlength="40">
    <button class="primary" id="loginBtn">Commencer</button>
    <div class="error" id="loginErr" role="alert"></div>
    <p class="note">Il sert à retrouver votre conversation sur tous vos appareils.</p>
  </form>
</main>

<section id="chat" class="hidden" aria-label="Conversation avec J3anClaud3">
  <header>
    <img src="/icon.svg" alt="">
    <div class="who">
      <b>J3anClaud3</b>
      <span><i class="dot" id="dot"></i><span id="status">connexion…</span></span>
    </div>
    <button class="icon-btn" id="themeBtn" type="button" title="Changer le thème" aria-label="Changer le thème">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>
    </button>
    <button class="icon-btn" id="logoutBtn" type="button">Déconnexion</button>
  </header>
  <div id="feed" role="log" aria-live="polite"></div>
  <div class="typing hidden" id="typing"><i></i><i></i><i></i> J3anClaud3 rédige…</div>
  <div class="quick" aria-label="Raccourcis">
    <button type="button" data-send="STATUT" data-mode="orchestre">📊 Statut</button>
    <button type="button" data-send="PROJETS" data-mode="orchestre">📂 Projets</button>
    <button type="button" data-send="PLAN" data-mode="orchestre">🧩 Plan</button>
    <button type="button" data-send="NOUVEAU">🆕 Nouveau</button>
    <button type="button" data-send="AIDE">❔ Aide</button>
  </div>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="Décrivez votre besoin…" aria-label="Message"></textarea>
    <button id="sendBtn" aria-label="Envoyer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
</section>

<dialog id="preview">
  <header>
    <div class="who"><b id="previewTitle"></b></div>
    <a class="icon-btn" id="previewDl" href="#">Télécharger</a>
    <button class="icon-btn" type="button" id="previewClose">Fermer</button>
  </header>
  <div id="previewBody"></div>
</dialog>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const feed = $("feed");
let lastId = 0, es = null, me = null, typingTimer = null, pendingReply = false;
const seen = new Set();

// --- theme (per-device preference) -------------------------------------------
function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
try { applyTheme(localStorage.getItem("j3-theme")); } catch (e) {}
$("themeBtn").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("j3-theme", next); } catch (e) {}
};

// --- tiny, safe Markdown (escape first, then a small subset) -----------------
function esc(s) { return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function inline(s) {
  return s.replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
          .replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s).,!?:;]|$)/g, "$1<b>$2</b>")
          .replace(/(^|[\s(])_([^_\s][^_]*)_(?=[\s).,!?:;]|$)/g, "$1<i>$2</i>");
}
function md(text, full) {
  const lines = esc(text).split("\n");
  let html = "", list = false, code = false;
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (full && line.startsWith("```")) { html += code ? "</pre>" : (list ? "</ul>" : "") + "<pre>"; list = false; code = !code; continue; }
    if (code) { html += line + "\n"; continue; }
    const li = line.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/);
    if (li) { if (!list) { html += "<ul>"; list = true; } html += "<li>" + inline(li[1]) + "</li>"; continue; }
    if (list) { html += "</ul>"; list = false; }
    const h = full && line.match(/^(#{1,3})\s+(.*)$/);
    if (h) { html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; continue; }
    if (full && /^\|.*\|$/.test(line)) {
      if (/^\|[\s:|-]+\|$/.test(line)) continue;
      html += "<table><tr>" + line.slice(1, -1).split("|").map(c => "<td>" + inline(c.trim()) + "</td>").join("") + "</tr></table>";
      continue;
    }
    html += line ? "<p>" + inline(line) + "</p>" : "";
  }
  return html + (list ? "</ul>" : "") + (code ? "</pre>" : "");
}

// --- rendering ---------------------------------------------------------------
function fmtTime(ts) { return new Date(ts * 1000).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); }
function fmtSize(n) { return n > 1024 ? (n / 1024).toFixed(1) + " Ko" : n + " o"; }

function render(m) {
  if (seen.has(m.id)) return;
  seen.add(m.id);
  lastId = Math.max(lastId, m.id);
  const empty = feed.querySelector(".empty"); if (empty) empty.remove();
  const row = document.createElement("div");
  row.className = "row " + (m.author === "u" ? "u" : "m");
  const b = document.createElement("div");
  b.className = "bubble";
  if (m.kind === "doc") {
    b.innerHTML = `<div class="doc"><div class="ico">MD</div><div class="meta"><b></b><span>${fmtSize(m.meta.size || 0)}</span></div>
      <div class="acts"><button class="icon-btn" data-act="view">Aperçu</button><a class="icon-btn" href="/api/files/${m.id}" download>Télécharger</a></div></div>`;
    b.querySelector("b").textContent = m.meta.name || m.body;
    b.querySelector('[data-act="view"]').onclick = () => openPreview(m);
  } else {
    b.innerHTML = md(m.body, false);
    if (m.kind === "buttons" && m.meta.buttons) {
      const box = document.createElement("div");
      box.className = "choices";
      for (const btn of m.meta.buttons) {
        const el = document.createElement("button");
        el.className = "choice"; el.type = "button"; el.textContent = btn.label;
        el.title = btn.send;
        el.onclick = () => { box.querySelectorAll("button").forEach(x => x.disabled = true); send(btn.send); };
        box.appendChild(el);
      }
      b.appendChild(box);
    }
  }
  const t = document.createElement("div"); t.className = "time"; t.textContent = fmtTime(m.ts);
  b.appendChild(t);
  row.appendChild(b);
  feed.appendChild(row);
  if (m.author === "m") { setTyping(false); notify(m); }
}

function scrollDown() { feed.scrollTop = feed.scrollHeight; }
function showEmpty() {
  if (feed.children.length) return;
  const intro = me.mode === "conversation"
    ? "Posez-moi vos questions ou discutons librement, en langage naturel."
    : "Décrivez votre besoin en langage naturel. Je le cadre avec vous, je vous propose un <b>plan</b>, et je ne lance la production qu'après <b>validation</b>.";
  feed.innerHTML = `<div class="empty"><p>👋 Bonjour <b>${esc(me.user)}</b> !</p><p>${intro}</p></div>`;
}
function setTyping(on) {
  pendingReply = on;
  $("typing").classList.toggle("hidden", !on);
  clearTimeout(typingTimer);
  if (on) typingTimer = setTimeout(() => setTyping(false), 90000);
}

// --- notifications when the tab is in the background --------------------------
function notify(m) {
  if (!document.hidden || !("Notification" in window) || Notification.permission !== "granted") return;
  try { new Notification("J3anClaud3", { body: m.kind === "doc" ? "📎 " + (m.meta.name || "Livrable") : m.body.slice(0, 140), icon: "/icon.svg" }); } catch (e) {}
}

// --- network -----------------------------------------------------------------
async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: "same-origin", headers: { "Content-Type": "application/json" }, ...opts });
  if (r.status === 401) { showLogin(); throw new Error("401"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

function connect() {
  if (es) es.close();
  es = new EventSource("/api/stream?after=" + lastId);
  es.addEventListener("message", (e) => {
    const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
    render(JSON.parse(e.data));
    if (atBottom) scrollDown();
  });
  es.onopen = () => { $("dot").classList.add("on"); $("status").textContent = "en ligne"; };
  es.onerror = () => {
    $("dot").classList.remove("on"); $("status").textContent = "reconnexion…";
    // Session may have expired: check, else let EventSource retry on its own.
    fetch("/api/me", { credentials: "same-origin" }).then(r => { if (r.status === 401) { es.close(); showLogin(); } });
  };
}

async function send(text) {
  text = text.trim();
  if (!text) return;
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission().catch(() => {});
  setTyping(true);
  try {
    await api("/api/send", { method: "POST", body: JSON.stringify({ text, id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random() }) });
  } catch (e) {
    setTyping(false);
    if (e.message !== "401") alert("Envoi impossible : " + e.message);
  }
}

async function openPreview(m) {
  $("previewTitle").textContent = m.meta.name || m.body;
  $("previewDl").href = `/api/files/${m.id}`;
  $("previewBody").textContent = "Chargement…";
  $("preview").showModal();
  const r = await fetch(`/api/files/${m.id}?inline=1`, { credentials: "same-origin" });
  $("previewBody").innerHTML = r.ok ? md(await r.text(), true) : "Fichier introuvable.";
}
$("previewClose").onclick = () => $("preview").close();

// --- views -------------------------------------------------------------------
async function showLogin() {
  if (es) es.close();
  $("chat").classList.add("hidden");
  $("login").classList.remove("hidden");
  try { applyMode((await fetch("/api/config").then(r => r.json())).mode); } catch (e) {}
  $("name").focus();
}

// Two modes: "orchestre" (plans, skills, deliverables) and "conversation" (plain chat).
function applyMode(mode) {
  const chat = mode === "conversation";
  $("tagline").textContent = chat ? "Votre assistant IA francophone" : "Le chef d'orchestre de votre agence d'agents IA";
  $("input").placeholder = chat ? "Écrivez votre message…" : "Décrivez votre besoin…";
  document.querySelectorAll('[data-mode="orchestre"]').forEach(b => b.hidden = chat);
}

async function showChat(info) {
  me = info;
  applyMode(info.mode);
  $("login").classList.add("hidden");
  $("chat").classList.remove("hidden");
  const history = await api("/api/messages?after=" + lastId);
  history.forEach(render);
  showEmpty();
  scrollDown();
  connect();
  $("input").focus();
}

$("loginForm").onsubmit = async (e) => {
  e.preventDefault();
  $("loginBtn").disabled = true; $("loginErr").textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: $("name").value }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "Connexion refusée");
    await showChat(data);
  } catch (err) { $("loginErr").textContent = err.message; }
  finally { $("loginBtn").disabled = false; }
};

$("logoutBtn").onclick = async () => {
  await fetch("/api/logout", { method: "POST", credentials: "same-origin" });
  feed.innerHTML = ""; seen.clear(); lastId = 0; showLogin();
};

const input = $("input");
function grow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; }
input.addEventListener("input", grow);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && matchMedia("(pointer: fine)").matches) {
    e.preventDefault(); $("composer").requestSubmit();
  }
});
$("composer").onsubmit = (e) => { e.preventDefault(); const t = input.value; input.value = ""; grow(); send(t); };
document.querySelectorAll("[data-send]").forEach(b => b.onclick = () => send(b.dataset.send));

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
fetch("/api/me", { credentials: "same-origin" })
  .then(r => r.ok ? r.json().then(showChat) : showLogin())
  .catch(showLogin);
</script>
</body>
</html>
