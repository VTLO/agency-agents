[project]
name = "m3lvin"
version = "0.1.0"
description = "M3LVin — chatbot orchestrateur francophone pour les agents de The Agency (web, API, terminal)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "httpx2>=2.0"]

[project.scripts]
m3lvin = "m3lvin.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["m3lvin"]

[tool.setuptools.package-data]
m3lvin = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
