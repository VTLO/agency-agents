name: M3LVin tests

on:
  pull_request:
    paths:
      - 'm3lvin/**'
      - '.github/workflows/m3lvin.yml'
  push:
    branches:
      - main
    paths:
      - 'm3lvin/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: m3lvin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: pytest -q
