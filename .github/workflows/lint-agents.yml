name: Lint Agent Files

on:
  pull_request:
    paths:
      - 'academic/**'
      - 'design/**'
      - 'engineering/**'
      - 'game-development/**'
      - 'marketing/**'
      - 'paid-media/**'
      - 'product/**'
      - 'project-management/**'
      - 'sales/**'
      - 'spatial-computing/**'
      - 'specialized/**'
      - 'support/**'
      - 'testing/**'
      - 'scripts/lint-agents.sh'
  push:
    branches:
      - main
    paths:
      - 'academic/**'
      - 'design/**'
      - 'engineering/**'
      - 'game-development/**'
      - 'marketing/**'
      - 'paid-media/**'
      - 'product/**'
      - 'project-management/**'
      - 'sales/**'
      - 'spatial-computing/**'
      - 'specialized/**'
      - 'support/**'
      - 'testing/**'
      - 'scripts/lint-agents.sh'
  workflow_dispatch:

jobs:
  lint:
    name: Validate agent frontmatter and structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed agent files (PR)
        id: changed
        if: github.event_name == 'pull_request'
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD -- \
            'academic/**/*.md' \
            'design/**/*.md' \
            'engineering/**/*.md' \
            'game-development/**/*.md' \
            'marketing/**/*.md' \
            'paid-media/**/*.md' \
            'product/**/*.md' \
            'project-management/**/*.md' \
            'sales/**/*.md' \
            'spatial-computing/**/*.md' \
            'specialized/**/*.md' \
            'support/**/*.md' \
            'testing/**/*.md')
          {
            echo "files<<ENDOFLIST"
            echo "$FILES"
            echo "ENDOFLIST"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$FILES" ]; then
            echo "No agent files changed."
          else
            echo "Changed files:"
            echo "$FILES"
          fi

      - name: Run agent linter (PR – changed files only)
        if: github.event_name == 'pull_request' && steps.changed.outputs.files != ''
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          chmod +x scripts/lint-agents.sh
          # shellcheck disable=SC2086
          ./scripts/lint-agents.sh $CHANGED_FILES

      - name: Run agent linter (push / manual – all files)
        if: github.event_name != 'pull_request'
        run: |
          chmod +x scripts/lint-agents.sh
          ./scripts/lint-agents.sh

      - name: Summary
        if: always()
        run: |
          echo "### Lint Results" >> "$GITHUB_STEP_SUMMARY"
          echo "Trigger: \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Ref: \`${{ github.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
